spring.application.name=MiniLeetCode
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${POSTGRES_URL}

spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=8082

# Redis server configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=

# Secure session cookie configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false 
server.servlet.session.cookie.same-site=lax
# session.cookie.secure should be set to true in production when using HTTPS
# session cookies is an cookie that points to the session id stored on the server.
# that for instance when looking in, points to that session id stored on the server,
# and the server can then retrieve the session data associated with that id.
